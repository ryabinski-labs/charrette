- id: REQ-007
  text: DeepSeek usage is priced at 0.30 USD per MTok input and 1.20 USD per MTok output, with cache reads at 0.1 times the input rate.
  priority: P0
  type: non-functional
  prd_ref: PRD section 5 story 2, section 13 and assumption A-003
  scenarios:
  - id: SC-007-a
    level: unit
    title: one million input and one million output tokens cost 1.50 USD
