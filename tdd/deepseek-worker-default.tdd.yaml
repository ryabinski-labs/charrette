schema: tdd-artifact/v1
feature: deepseek-worker-default
title: DeepSeek V4.1 Flash as the default worker model
source:
  prd: docs/prd/deepseek-worker-default.md
  prd_sha256: 834727a2c88435a6c278cadcec4c2df8f76d07df9c0bd7eda6aa44e12c5c6bea
defaults:
  priority: P2
non_goals:
- models.workerUi stays claude-opus-5 and models.workerHeavy stays claude-fable-5-1.
- qa, prod and intake stay on Anthropic and reviewer stays on Google.
- The planner does not nominate a per-task model; modelTier.ts remains the only tier rule.
- No DeepSeek Anthropic-format endpoint and no resumable DeepSeek sessions.
- No change to worker prompts, injected skills or the worker tool set.
- No automatic fallback to Sonnet when DEEPSEEK_API_KEY is absent.
open_questions: []
requirements:
- id: REQ-001
  text: A run config that omits the worker models defaults models.worker and models.workerLight to deepseek-flash.
  priority: P0
  type: functional
  prd_ref: PRD section 4 goal 1 and section 5 story 1
  scenarios:
  - id: SC-001-a
    level: unit
    title: an empty models object defaults both regular worker tiers to DeepSeek
    given: a run config with no models object
    when: RunConfig.parse is called with an empty object
    then: models.worker and models.workerLight are both deepseek-flash
    oracle: RunConfig.parse({}).models.worker === "deepseek-flash" and RunConfig.parse({}).models.workerLight === "deepseek-flash"
    status: green
    doubles: none; pure schema parse
    test_ref: packages/shared/src/deepseek.test.ts::SC-001-a an empty models object defaults both regular worker tiers to DeepSeek
  - id: SC-001-b
    level: acceptance
    title: a default run records a DeepSeek worker session in the ledger
    given: a fixture repository with a DeepSeek key and no model overrides
    when: a regular build task completes through charrette run
    then: the ledger holds a worker session on deepseek-flash priced at the DeepSeek rate
    oracle: the sessions row for the task has model deepseek-flash and spentUsd equals the DeepSeek-priced sum within 0.01 USD
    status: green
    doubles: fixture repository and a stubbed vendor; no live DeepSeek call
    tags:
    - acceptance
    - ledger
    test_ref: apps/cli/src/cli.test.ts::SC-001-b starts a default run on the DeepSeek worker models
- id: REQ-002
  text: 'A model name beginning deepseek- resolves to the deepseek provider, and an explicit deepseek/ or deepseek: prefix splits without reaching the wire id.'
  priority: P0
  type: functional
  prd_ref: PRD section 7 and assumption A-001
  scenarios:
  - id: SC-002-a
    level: unit
    title: the deepseek family is read from the model name
    given: the model names deepseek-flash and deepseek-v4-flash
    when: providerFor resolves each name
    then: both resolve to the deepseek provider
    oracle: providerFor("deepseek-flash") === "deepseek" and providerFor("deepseek-v4-flash") === "deepseek"
    status: green
    doubles: none
    test_ref: packages/shared/src/deepseek.test.ts::SC-002-a the deepseek family is read from the model name
  - id: SC-002-b
    level: unit
    title: an explicit deepseek prefix is split and stripped
    given: the model strings deepseek/deepseek-flash and deepseek:deepseek-v4-flash
    when: splitModel and modelId run
    then: the provider is deepseek and the wire id is the part after the separator
    oracle: 'splitModel("deepseek/deepseek-flash") equals {provider: "deepseek", id: "deepseek-flash"} and modelId("deepseek:deepseek-v4-flash") === "deepseek-v4-flash"'
    status: green
    doubles: none
    test_ref: packages/shared/src/deepseek.test.ts::SC-002-b an explicit deepseek prefix is split and stripped
- id: REQ-003
  text: The DeepSeek client sends OpenAI chat-completions requests to api.deepseek.com with the bearer key, sends max_tokens, echoes reasoning_content on every later tool turn, and maps a response without cached-token details to zero cache reads.
  priority: P0
  type: functional
  prd_ref: PRD section 12 and section 5 story 4
  scenarios:
  - id: SC-003-a
    level: contract
    title: the DeepSeek request matches the OpenAI chat-completions shape
    given: a recording fetch stub and a turn whose history carries a tool call
    when: the DeepSeek client sends the turn
    then: the request targets api.deepseek.com with the bearer key and the OpenAI message shape
    oracle: url is https://api.deepseek.com/chat/completions, headers.authorization is Bearer sk-deepseek, body.model is deepseek-flash and body.messages[0] is the system message
    status: green
    doubles: fetch replaced by the recording stub
    test_ref: packages/core/src/deepseek.test.ts::SC-003-a the DeepSeek request matches the OpenAI chat-completions shape
  - id: SC-003-b
    level: unit
    title: a response without cached-token details books zero cache reads
    given: a DeepSeek response with usage.prompt_tokens 100 and no prompt_tokens_details
    when: the client maps the usage
    then: cacheReadTokens is 0 and inputTokens is 100
    oracle: usage.cacheReadTokens === 0 and usage.inputTokens === 100
    status: green
    doubles: fetch stub
    test_ref: packages/core/src/deepseek.test.ts::SC-003-b a response without cached-token details books zero cache reads
  - id: SC-003-c
    level: unit
    title: the chain of thought comes back on the next tool turn
    given: a DeepSeek turn that returns reasoning_content with a tool call
    when: the next request is sent with the same assistant message
    then: the request carries reasoning_content on that assistant message
    oracle: the second request body has an assistant message with reasoning_content equal to the first turn's reasoning
    status: green
    doubles: fetch stub
    test_ref: packages/core/src/deepseek.test.ts::SC-003-c the chain of thought comes back on the next tool turn
  - id: SC-003-d
    level: unit
    title: the request sends max_tokens, the field DeepSeek documents
    given: a DeepSeek turn with maxOutputTokens set to 64000
    when: the client sends the request
    then: the body carries max_tokens 64000 and no max_completion_tokens
    oracle: body.max_tokens === 64000 and body.max_completion_tokens === undefined
    status: green
    doubles: fetch stub
    test_ref: packages/core/src/deepseek.test.ts::SC-003-d sends max_tokens, the field DeepSeek documents
- id: REQ-004
  text: A worker routed to deepseek-flash runs through the repository tool loop, executes its tool calls and returns the final text without calling the Anthropic SDK.
  priority: P0
  type: functional
  prd_ref: PRD section 5 story 4 and section 12
  scenarios:
  - id: SC-004-a
    level: integration
    title: a worker session on DeepSeek drives the local tool loop
    given: a pool spec on deepseek-flash and a stub vendor that answers a Bash call then a final text
    when: AgentPool.run executes the session
    then: the tool ran once, the result text is returned and the Anthropic SDK was never called
    oracle: the tool ran once, resultText === "built it", the Anthropic query spy was not called and the request URL contains api.deepseek.com
    status: green
    doubles: fetch stub and Anthropic query spy
    test_ref: packages/core/src/poolTransport.test.ts::SC-004-a a worker session on DeepSeek drives the local tool loop
- id: REQ-005
  text: The light-tier rule still decides and reports its tier when worker and workerLight both name deepseek-flash.
  priority: P0
  type: functional
  prd_ref: PRD section 5 story 1 and section 9
  scenarios:
  - id: SC-005-a
    level: unit
    title: a light task is still decided light when both regular tiers name DeepSeek
    given: a light-admissible task and both regular tiers set to deepseek-flash
    when: workerModelFor decides the tier
    then: the decision tier is light and the chosen model is deepseek-flash
    oracle: workerModelFor(task, models).decision.tier === "light" and workerModelFor(task, models).model === "deepseek-flash"
    status: green
    doubles: none
    test_ref: packages/core/src/deepseek.test.ts::SC-005-a a light task is still decided light when both regular tiers name DeepSeek
