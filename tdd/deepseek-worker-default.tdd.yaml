    when: costUsd prices the usage
    then: the charge is 1.50 USD
    oracle: costUsd("deepseek-flash", usage) is within 0.000001 of 1.50
    status: green
    doubles: none
    test_ref: packages/core/src/deepseek.test.ts::SC-007-a one million input and one million output tokens cost 1.50 USD
  - id: SC-007-b
    level: unit
    title: one million cache-read tokens cost 0.03 USD
    given: a usage total of 1,000,000 cache-read tokens on deepseek-flash
    when: costUsd prices the usage
    then: the charge is 0.03 USD, which is 0.1 times the input rate
    oracle: costUsd("deepseek-flash", usage) is within 0.000001 of 0.03
    status: green
    doubles: none
    test_ref: packages/core/src/deepseek.test.ts::SC-007-b one million cache-read tokens cost 0.03 USD
- id: REQ-008
  text: A routing table that resolves a role to DeepSeek is refused when DEEPSEEK_API_KEY is not set, and accepted when it is.
  priority: P0
  type: functional
  prd_ref: PRD section 5 story 3 and decision DL-002
  scenarios:
  - id: SC-008-a
    level: unit
    title: a missing DeepSeek key is reported against the role and model
    given: an environment without DEEPSEEK_API_KEY
    when: missingKeys examines models.worker set to deepseek-flash
    then: one sentence names DEEPSEEK_API_KEY, the worker role and the model
    oracle: 'missingKeys({worker: "deepseek-flash"}, {}) equals ["DEEPSEEK_API_KEY is not set, but worker (deepseek-flash) is routed to deepseek."]'
    status: green
    negative: true
    doubles: none; a plain environment object
    test_ref: packages/core/src/deepseek.test.ts::SC-008-a a missing DeepSeek key is reported against the role and model
  - id: SC-008-b
    level: unit
    title: a present DeepSeek key produces no violation
    given: an environment with DEEPSEEK_API_KEY set
    when: missingKeys examines models.worker set to deepseek-flash
    then: no violation is returned
    oracle: 'missingKeys({worker: "deepseek-flash"}, {DEEPSEEK_API_KEY: "sk-test"}) equals []'
    status: green
    doubles: none
    test_ref: packages/core/src/deepseek.test.ts::SC-008-b a present DeepSeek key produces no violation
