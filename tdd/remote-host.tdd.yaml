- id: REQ-009
  text: A 5xx or a notice that does not answer within five seconds is retried twice at two and ten seconds, and after the last failure one agent.log line records it while the run continues.
  priority: P0
  type: functional
  prd_ref: §5 P0 story 2 error criteria; §13 notice latency
  scenarios:
  - id: SC-009-a
    red_verified: "2026-11-21"
    level: unit
    title: a 5xx is retried twice at two and ten seconds
    given: a fetch that answers 503 every time
    when: the notice is sent
    then: four attempts are made and the sleeps are 2000 and 10000 milliseconds
    oracle: fetch call count === 4 and sleeps === [2000, 10000] and result.ok === false and result.status === 503
    status: red
    doubles: fetch and sleep replaced
    test_ref: apps/cli/src/notifyPush.test.ts::SC-009-a a 5xx is retried twice at two and ten seconds
  - id: SC-009-b
    red_verified: "2026-11-21"
    level: unit
    title: a notice that times out is retried and never blocks the run
    given: a fetch that never settles until its signal aborts
    when: the notice is sent with a short test timeout
    then: the attempt aborts, is retried, and the sender returns a failure rather than throwing
    oracle: the call resolves to ok false, fetch was called three times, and no exception escapes
    status: red
    doubles: fetch replaced by an abort-aware stub; timeout shortened for the test
    test_ref: apps/cli/src/notifyPush.test.ts::SC-009-b a notice that times out is retried and never blocks the run
  - id: SC-009-c
    red_verified: "2026-11-21"
    level: integration
    title: the last failure writes one agent.log line and does not throw
    given: a real Bus and a notify target whose fetch always answers 500
    when: a gate event is published
    then: one agent.log event says the notice failed and the bus keeps working
    oracle: exactly one agent.log event contains "notify"; a notify.failed event exists; publishing another event does not throw
    status: red
    doubles: fetch replaced; the bus and store are real
    test_ref: apps/cli/src/notifyPush.test.ts::SC-009-c the last failure writes one agent.log line and does not throw
- id: REQ-010
  text: An invalid CHARRETTE_NOTIFY_URL, or a non-loopback http URL, stops charrette run with a message naming the variable.
