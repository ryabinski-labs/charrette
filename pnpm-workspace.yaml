packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.257'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.257'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.257'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.257'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.257'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.257'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.257'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.257'
  - '@anthropic-ai/claude-agent-sdk@0.3.257'
  # Security fixes newer than the release-age window. The vulnerable version is
  # in the tree now; waiting a day for these two buys nothing, and both carry
  # the advisory fix. Drop the exclusions once a later patch has aged in.
  - hono@4.13.14
  - ip-address@10.7.5
overrides:
  # fast-uri 3.1.9 closes four advisories: percent-encoded scheme spoofing,
  # relative-reference path equivalence, WHATWG host canonicalization, and
  # scheme injection via a suffix-reference colon. It reaches us through
  # fastify's ajv compiler and the Agent SDK's ajv, neither of which has
  # floated its own range past 3.1.8 yet.
  fast-uri: "^3.1.9"
  # Five advisories against vite <= 7.3.6, ending in 7.3.7: launch-editor
  # argument escaping and existence-check bypasses, cross-origin middleware
  # execution, and serving files outside `server.fs.allow`. Vitest offers
  # ^6 || ^7 || ^8; stay on 7 rather than take a major in a security fix.
  vite: "^7.3.7"
  esbuild: "^0.25.0"

  # ip-address 10.7.5 closes every open advisory in the 10.x line: link-local
  # and NAT64 range classifiers, cross-family subnet comparison, and two
  # quadratic-time parses. It arrives through express-rate-limit, which the
  # MCP SDK pulls in for its HTTP transports.
  ip-address: "^10.7.5"
  # Hono 4.13.11 rejects a second path decode in `serveStatic`; 4.13.14 is the
  # current patch. The SDK's HTTP transport peers on ^4 and takes it directly.
  hono: "^4.13.14"
  # source-map-js 1.2.2 bounds indexed section offsets that could stall the
  # event loop. It is installed twice: through vite's postcss and through
  # magicast in @vitest/coverage-v8, both of which still ask for ^1.2.1.
  source-map-js: "^1.2.2"
  # proxy-addr 2.0.8 stops an IPv4-mapped IPv6 address from being trusted as
  # its IPv4 form. Express asks for ^2.0.7, so this is a patch bump on a path
  # the MCP SDK installs but Charrette does not call (we drive it over stdio).
  proxy-addr: "^2.0.8"
  # body-parser 2.4.0 rejects trailing bytes after a compressed body instead
  # of treating them as another request. Express asks for ^2.2.1.
  body-parser: "^2.4.0"
  # nanoid 3.3.18 bounds custom generators when `size` is zero. postcss pins
  # ^3.3.11 and is the only caller; a 4.x/6.x jump would be a needless major.
  nanoid: "^3.3.18"

  # qs reaches us the same way: @modelcontextprotocol/sdk pulls express (and
  # so qs) for its HTTP transport. We drive the SDK over stdio, so the parser
  # is not on a path we call — but it is installed, it is what an advisory scan
  # sees, and Dependabot cannot lift it on its own because nothing in this repo
  # declares the package.
  #
  # qs 6.16.0 fixes GHSA-x5fp-wj9c-mxmx (array-limit bypass via bracket-key
  # comma parsing) and GHSA-4mjr-xmp4-gh2g (DoS via attacker-controlled
  # isBuffer). The SDK's own ranges already allow it (body-parser asks for
  # ^6.15.2, express for ^6.14.0); only the lockfile held 6.15.3, and no
  # `pnpm update` targets a package no manifest names.
  qs: "^6.16.0"
