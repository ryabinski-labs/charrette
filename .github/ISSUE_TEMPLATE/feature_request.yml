name: Feature request
description: Something the project should do and does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do when you wanted this. Not the solution — the situation.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. If you already have a shape in mind, describe it.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: The workaround, if there is one. This is often the most useful field.
