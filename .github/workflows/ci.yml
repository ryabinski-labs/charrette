name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a red main can be re-checked without an empty commit.
  workflow_dispatch:

# A new push to a PR makes the in-flight run irrelevant; don't burn minutes on it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck, build, test @ 100% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # Node 24: `node:sqlite` (packages/core/src/store.ts) is only available
      # unflagged from 23.4 on, and the store is not an optional part of the
      # suite — every runController test builds one.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Not a redundant check on top of typecheck: the packages are consumed
      # through their `dist/` entrypoints, and `tsc --noEmit` will not catch a
      # build that fails only when it has to actually write declarations.
      - name: Build
        run: pnpm build

      # `vitest run` fails the job on the first failing test. The coverage
      # thresholds in vitest.config.ts (100% lines/functions/branches/
      # statements) fail it separately, after the suite passes — so a green
      # tick means both "every test passed" and "every shipped line ran".
      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        # Uploaded on failure too — that is exactly when someone needs to open
        # the HTML report to see which lines went uncovered.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
