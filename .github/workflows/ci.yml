name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a red main can be re-checked without an empty commit.
  workflow_dispatch:

# A new push to a PR makes the in-flight run irrelevant; don't burn minutes on it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: build, test @ 100% coverage
    # Any self-hosted runner in the org, on purpose. The old `github-runner`
    # label claimed to keep this off the special-purpose hosts (api-service-mx1,
    # mobile) — it never did, because those carry that label too; the ephemeral
    # pool simply picked jobs up first. When the pool went offline the job
    # landed on the mail host and, at ~5x the wall clock, failed a suite in
    # which every test passed. So: run anywhere, and make the suite survive the
    # slowest machine that will take it (see `maxWorkers` in vitest.config.ts).
    runs-on: [self-hosted, Linux, X64]
    # Ample for a dedicated runner (~2m30s end to end) and for a busy shared one
    # taking four times that.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # No `version:` on purpose — the action reads `packageManager` from
      # package.json, so CI and every developer machine run the same pnpm.
      # They did not: CI pinned 9 while local was 11, and the two read their
      # settings from different files. pnpm 10 moved `overrides` out of
      # package.json into pnpm-workspace.yaml, so the version that wrote the
      # lockfile recorded overrides the version installing it could not see —
      # `--frozen-lockfile` then failed with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
      - uses: pnpm/action-setup@v6

      # Node 24: `node:sqlite` (packages/core/src/store.ts) is only available
      # unflagged from 23.4 on, and the store is not an optional part of the
      # suite — every runController test builds one.
      # `cache: pnpm` is set explicitly and must stay that way: from v6 on, the
      # action's *automatic* caching only ever triggers for npm, so dropping
      # this line would silently lose the store cache rather than error.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build is the typecheck. Each package compiles the same project either
      # way — `typecheck` is `build --noEmit` — and it has to be this one,
      # because the packages resolve each other through their `dist/*.d.ts`.
      # Nothing but a build writes those, so `pnpm typecheck` on a clean
      # checkout fails on every cross-package import in the repo: it is only
      # green on a machine that has built at some point, which is why it passed
      # locally and failed here. pnpm walks the workspace in dependency order,
      # so shared emits before core compiles against it.
      - name: Build (typechecks every package)
        run: pnpm build

      # `vitest run` fails the job on the first failing test. The coverage
      # thresholds in vitest.config.ts (100% lines/functions/branches/
      # statements) fail it separately, after the suite passes — so a green
      # tick means both "every test passed" and "every shipped line ran".
      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        # Uploaded on failure too — that is exactly when someone needs to open
        # the HTML report to see which lines went uncovered.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
